# dsh-weixin bundle patch: inserts the dual-face plugin row into the web
# profile roster. Applied as a profile bundle layer (the `dsh.bundle.patch`
# manifest field) over dsh-base; activate with
# `dsh plugin --profile <name> add link:~/dsh-wechat-maid/packages/dsh-weixin`.
- insert:
    - id: weixin
      name: '@deepseek-ai/dsh-weixin'
